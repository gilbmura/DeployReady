name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js dependencies including dev dependencies for testing
      - name: Install dependencies
        run: npm install
        working-directory: app

      # Run the test suite — pipeline stops here if any test fails
      - name: Run tests
        run: npm test
        working-directory: app

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry using stored secrets
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Build the Docker image and tag it with the Git commit SHA for traceability
      - name: Build and push Docker image
        id: meta
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/deployready:latest
            ghcr.io/${{ secrets.GHCR_USERNAME }}/deployready:${{ github.sha }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH into the cloud server, pull the new image, and restart the container
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Log in to GHCR on the server
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull the latest image
            docker pull ghcr.io/${{ secrets.GHCR_USERNAME }}/deployready:${{ github.sha }}

            # Stop and remove the existing container if running
            docker stop deployready || true
            docker rm deployready || true

            # Start the new container
            docker run -d \
              --name deployready \
              --restart unless-stopped \
              -p 80:3000 \
              -e PORT=3000 \
              ghcr.io/${{ secrets.GHCR_USERNAME }}/deployready:${{ github.sha }}

            # Verify the container started successfully
            sleep 5
            docker ps | grep deployready
